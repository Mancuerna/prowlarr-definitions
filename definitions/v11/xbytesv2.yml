---
id: xbytesv2
name: XbytesV2
description: "XbytesV2 is a Spanish private tracker for HD movies, TV, music, games, software, books, and general releases"
language: es-ES
type: private
encoding: UTF-8
links:
  - https://xbytesv2.li/
legacylinks:
  - http://xbytesv2.li/

caps:
  categorymappings:
    - {id: 17, cat: Movies/BluRay, desc: "Video - FullBluray/BDRemux"}
    - {id: 23, cat: Movies/3D, desc: "Video - 3D"}
    - {id: 18, cat: Movies/HD, desc: "Video - 1080p"}
    - {id: 30, cat: Movies/HD, desc: "Video - MicroHD x265"}
    - {id: 29, cat: Movies/HD, desc: "Video - 1080p x265"}
    - {id: 16, cat: Movies/HD, desc: "Video - MicroHD"}
    - {id: 61, cat: Movies, desc: "Video - Custom"}
    - {id: 42, cat: Movies/DVD, desc: "Video - DVD"}
    - {id: 21, cat: Movies/BluRay, desc: "Video UHD - FullBluray/BDRemux"}
    - {id: 45, cat: Movies/UHD, desc: "Video UHD - UHD BDRip"}
    - {id: 46, cat: Movies/UHD, desc: "Video UHD - M-UHD"}
    - {id: 62, cat: Movies/UHD, desc: "Video UHD - Custom 4K"}
    - {id: 25, cat: TV/HD, desc: "Series - Temp. completa"}
    - {id: 31, cat: TV/HD, desc: "Series - x265"}
    - {id: 35, cat: TV/UHD, desc: "Series - 4K"}
    - {id: 41, cat: TV/Sport, desc: "Deportes"}
    - {id: 37, cat: TV/Documentary, desc: "Documentales"}
    - {id: 34, cat: TV/HD, desc: "Dibujos animados"}
    - {id: 5, cat: TV/Anime, desc: "Anime"}
    - {id: 14, cat: Audio/MP3, desc: "Musica - MP3"}
    - {id: 39, cat: Audio/Lossless, desc: "Musica - FLAC"}
    - {id: 38, cat: Audio/Other, desc: "Musica - otros formatos"}
    - {id: 27, cat: PC/Games, desc: "Juegos"}
    - {id: 65, cat: Console, desc: "Juegos Retro"}
    - {id: 33, cat: Books, desc: "Libros"}
    - {id: 7, cat: PC/0day, desc: "Software"}
    - {id: 40, cat: PC/Mobile-Other, desc: "Telefonos y tablets"}
    - {id: 12, cat: XXX, desc: "Adult"}
    - {id: 32, cat: Other, desc: "Otros"}
    - {id: 19, cat: Movies/HD, desc: "Video - 720p"}

  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid, tvdbid, tmdbid]
    movie-search: [q, imdbid, tmdbid]
    music-search: [q]
    book-search: [q]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: created_at
    options:
      created_at: created
      seeders: seeders
      size: size
      name: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc

login:
  path: login
  method: form
  form: form[action$="/login"]
  inputs:
    input[name="username"]: "{{ .Config.username }}"
    input[name="password"]: "{{ .Config.password }}"
    input[name="remember"]: on
    input[name="_username"]: ""
  selectors: true
  selectorinputs:
    _token:
      selector: input[name="_token"]
      attribute: value
    _captcha:
      selector: input[name="_captcha"]
      attribute: value
  error:
    - selector: .invalid-feedback
    - selector: .alert-danger
  test:
    path: torrents
    selector: form[action$="/logout"], a[href*="/logout"], a[href*="/users/"]

search:
  paths:
    - path: torrents

  inputs:
    $raw: "{{ range .Categories }}&category={{.}}{{end}}"
    name: "{{ .Keywords }}"
    seasonNumber: "{{ .Query.Season }}"
    episodeNumber: "{{ .Query.Ep }}"
    tmdbId: "{{ .Query.TMDBID }}"
    imdbId: "{{ .Query.IMDBIDShort }}"
    tvdbId: "{{ .Query.TVDBID }}"
    "free[]": "{{ if .Config.freeleech }}100{{ else }}{{ end }}"
    sortField: "{{ .Config.sort }}"
    sortDirection: "{{ .Config.type }}"
    view: list
    perPage: 100
    page: 1

  rows:
    selector: tr[data-torrent-id]:has(a[href*="/torrents/download/"]), table > tbody > tr:has(a[href*="/torrents/download/"])

  fields:
    category:
      selector: :root
      attribute: data-category-id
    title:
      selector: a.torrent-search--list__name, a.view-torrent, a[href*="/torrents/"]:not([href*="/download/"])
      filters:
        - name: trim
        - name: re_replace
          args: ["^ *\\[[^\\]]*\\] *", ""]
        - name: re_replace
          args: ["UHDRip", "BDRip"]
    details:
      selector: a.torrent-search--list__name, a.view-torrent, a[href*="/torrents/"]:not([href*="/download/"])
      attribute: href
    download:
      selector: a[href*="/torrents/download/"]
      attribute: href
    poster:
      selector: div.torrent-poster img, img.torrent-poster, img[src*="image.tmdb.org"]
      attribute: src
      optional: true
      filters:
        - name: replace
          args: ["https://via.placeholder.com/90x135", ""]
    imdbid:
      selector: :root
      attribute: data-imdb-id
    tmdbid:
      selector: :root
      attribute: data-tmdb-id
    tvdbid:
      selector: :root
      attribute: data-tvdb-id
    files:
      text: 1
    seeders:
      selector: .torrent__seeder-count, td.torrent-listings-seeders
      filters:
        - name: trim
    leechers:
      selector: .torrent__leecher-count, td.torrent-listings-leechers
      filters:
        - name: trim
    grabs:
      selector: .torrent__times-completed-count, td.torrent-listings-completed
      filters:
        - name: trim
    date:
      selector: time[datetime]
      attribute: datetime
      filters:
        - name: dateparse
          args: "yyyy-MM-dd HH:mm:ss"
    size:
      selector: .torrent-search--list__size, td.torrent-listings-size
      filters:
        - name: regexp
          args: "([\\d.]+\\s*[KMGT]i?B)"
    downloadvolumefactor:
      case:
        i.torrent-icons__freeleech: 0
        i.torrent-icons__featured: 0
        i[class*="fa-star text-gold"]: 0
        i[class*="fa-certificate text-pink"]: 0
        img[src$="freeleech.gif"]: 0
        img[src$="gold.gif"]: 0
        img[src$="silver.gif"]: 0.5
        img[src$="bronze.gif"]: 0.25
        "*": 1
    uploadvolumefactor:
      case:
        i.torrent-icons__double-upload: 2
        i.torrent-icons__featured: 2
        i[class*="fa-gem text-green"]: 2
        img[src$="2x.gif"]: 2
        img[src$="3x.gif"]: 3
        img[src$="4x.gif"]: 4
        img[src$="5x.gif"]: 5
        img[src$="6x.gif"]: 6
        img[src$="7x.gif"]: 7
        img[src$="8x.gif"]: 8
        img[src$="9x.gif"]: 9
        img[src$="10x.gif"]: 10
        "*": 1
    minimumratio:
      text: 1.0
    minimumseedtime:
      # 3 days in seconds.
      text: 259200
# UNIT3D/Laravel HTML
